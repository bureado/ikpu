[package]
name = "upki-cli"
version = "1.0.1"
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Platform-independent browser-grade certificate infrastructure"

[features]
default = ["fetch"]
fetch = ["upki/fetch", "__fetch"]
fetch-native-tls = ["upki/fetch-native-tls", "__fetch"]
__fetch = ["upki/__fetch"]

[dependencies]
clap.workspace = true
eyre.workspace = true
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
upki = { version = "1", path = "../upki" }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
whatadistro.workspace = true

[dev-dependencies]
clubcard.workspace = true
clubcard-crlite = { workspace = true, features = ["builder"] }
jiff.workspace = true
insta.workspace = true
insta-cmd.workspace = true
regex.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile.workspace = true
tiny_http.workspace = true

[lints]
workspace = true
